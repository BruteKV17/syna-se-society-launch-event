<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E086FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="synapseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Circuit Trace Lines -->
  <g stroke="url(#synapseGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glowFilter)">
    <!-- Circuit lines radiating left -->
    <path d="M 120 180 L 40 180 M 40 180 L 15 220 M 120 280 L 30 280 M 30 280 L 10 260" />
    <circle cx="15" cy="220" r="8" fill="#A855F7" />
    <circle cx="10" cy="260" r="6" fill="#C084FC" />

    <!-- Circuit lines radiating right -->
    <path d="M 380 160 L 440 160 M 440 160 L 470 120 M 380 240 L 450 240 M 450 240 L 480 280" />
    <circle cx="470" cy="120" r="9" fill="#E086FF" />
    <circle cx="480" cy="280" r="7" fill="#A855F7" />

    <!-- Additional top-right nodes -->
    <path d="M 320 100 L 360 60 M 360 60 L 420 60" />
    <circle cx="420" cy="60" r="8" fill="#C084FC" />
    <circle cx="360" cy="60" r="5" fill="#E086FF" />
  </g>

  <!-- Core Hexagonal Synapse 'S' Emblem -->
  <g filter="url(#glowFilter)">
    <!-- Main Outer Polygon S -->
    <path d="M 340 120 
             L 200 120 
             L 140 200 
             L 260 200 
             L 320 280 
             L 160 280 
             L 160 340 
             L 340 340 
             L 400 260 
             L 280 260 
             L 220 180 
             L 340 180 Z" 
          fill="url(#synapseGrad)" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linejoin="miter" />

    <!-- Inner Metallic Core Accent -->
    <path d="M 320 140 
             L 220 140 
             L 170 200 
             L 240 200 
             L 300 280 
             L 180 280 
             L 180 320 
             L 320 320 
             L 370 260 
             L 300 260 
             L 240 180 
             L 320 180 Z" 
          fill="#0E091B" 
          opacity="0.9" />

    <!-- Center Energy Core Beam -->
    <path d="M 230 160 L 300 160 L 250 230 L 310 300 L 200 300" 
          fill="none" 
          stroke="#E086FF" 
          stroke-width="5" 
          stroke-linecap="round" />
  </g>

  <!-- Glowing Nodes on S Body -->
  <circle cx="340" cy="120" r="12" fill="#E086FF" filter="url(#glowFilter)" />
  <circle cx="340" cy="120" r="5" fill="#FFFFFF" />
  <circle cx="160" cy="340" r="12" fill="#A855F7" filter="url(#glowFilter)" />
  <circle cx="160" cy="340" r="5" fill="#FFFFFF" />
</svg>
