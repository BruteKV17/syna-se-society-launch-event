<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <linearGradient id="brandPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
  </defs>

  <!-- Left Side: Circuit Traces & Nodes (Clean Vector, No Glow Blur) -->
  <g stroke="#8B5CF6" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper circuit branch -->
    <path d="M 220 100 L 280 70 L 330 70" />
    <path d="M 240 80 L 300 45 L 350 45" />
    <circle cx="330" cy="70" r="7" fill="#A855F7" />
    <circle cx="350" cy="45" r="8.5" fill="#C084FC" />

    <!-- Left side circuit lines -->
    <path d="M 90 150 L 30 150" />
    <path d="M 100 190 L 40 190 L 15 220" />
    <path d="M 80 220 L 35 240 L 15 275" />
    <circle cx="30" cy="150" r="6" fill="#8B5CF6" />
    <circle cx="15" cy="220" r="7.5" fill="#A855F7" />

    <!-- Lower circuit lines -->
    <path d="M 170 255 L 250 230 L 310 230" />
    <path d="M 190 280 L 240 255 L 290 255" />
    <circle cx="310" cy="230" r="7.5" fill="#9333EA" />
    <circle cx="290" cy="255" r="5.5" fill="#C084FC" />
  </g>

  <!-- Central Sharp Hexagonal 'S' Emblem (Full Vector, Crisp Edges) -->
  <g>
    <!-- Outer Hexagonal S Body -->
    <path d="M 210 60 
             L 135 60 
             L 75 145 
             L 155 145 
             L 205 215 
             L 105 215 
             L 105 265 
             L 220 265 
             L 280 175 
             L 190 175 
             L 145 105 
             L 210 105 Z" 
          fill="url(#brandPurple)" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linejoin="miter" />

    <!-- Inner Core Cutout -->
    <path d="M 190 80 
             L 150 80 
             L 105 145 
             L 175 145 
             L 220 215 
             L 130 215 
             L 130 245 
             L 200 245 
             L 255 175 
             L 170 175 
             L 130 105 
             L 190 105 Z" 
          fill="#07050E" />

    <!-- Solid White Accent Nodes -->
    <circle cx="210" cy="60" r="8" fill="#C084FC" />
    <circle cx="210" cy="60" r="3.5" fill="#FFFFFF" />
    <circle cx="105" cy="265" r="8" fill="#8B5CF6" />
    <circle cx="105" cy="265" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Right Side: Full Crisp Typography (NO Blur, NO Drop Shadows) -->
  <!-- "THE" -->
  <text x="410" y="88" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-style="italic" font-size="38" fill="#A855F7" letter-spacing="4">
    THE
  </text>

  <!-- "SYNAPSE" (Full word, completely visible) -->
  <text x="405" y="172" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="90" fill="#FFFFFF" letter-spacing="4">
    SYNAPSE
  </text>

  <!-- "SOCIETY" Capsule Pill -->
  <g transform="translate(405, 192)">
    <rect x="0" y="0" width="290" height="58" rx="29" ry="29" fill="#1C1430" stroke="#7C3AED" stroke-width="2" />
    <text x="145" y="40" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" letter-spacing="10" text-anchor="middle">
      SOCIETY
    </text>
  </g>
</svg>
